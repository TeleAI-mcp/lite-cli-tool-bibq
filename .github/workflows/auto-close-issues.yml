name: Auto Close Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  close-completed-wontfix:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            console.log(`Closed issue #${context.issue.number} due to label: ${context.payload.label.name}`);